name: Python application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # "3.x" resolves to the newest stable Python release.
        python-version: [ "3.12", "3.x" ]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . --group test
    - name: Test with pytest
      run: |
        pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=html
    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-py${{ matrix.python-version }}
        path: |
          coverage.xml
          htmlcov/
        if-no-files-found: warn

  lint:
    name: Lint and type check (non-blocking)
    runs-on: ubuntu-latest
    # Findings are reported but do not fail the workflow yet.
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install package and lint dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . --group lint
    - name: ruff check
      if: always()
      run: ruff check --output-format=github .
    - name: ruff format
      if: always()
      run: ruff format --check --diff .
    - name: ty
      if: always()
      run: ty check --python "$(which python)"

  publish:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.12.3"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          environment: pypi