[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nmrdfrommd"
version = "0.2.0"
description = "Calculate dipolar NMR relaxation rates from molecular dynamics trajectory files"
authors = [
    { name = "Simon Gravelle", email = "simon.gravelle@cnrs.fr" }
]
readme = "LONG_DESCRIPTION.rst"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "scipy>=1.15",
    "MDAnalysis",
]

[project.urls]
Homepage = "https://nmrdfrommd.github.io/"
Repository = "https://github.com/NMRDfromMD/nmrdfrommd"

[dependency-groups]
test = ["pytest", "pytest-cov"]
lint = ["ruff", "ty"]

[tool.setuptools]
packages = ["nmrdfrommd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["nmrdfrommd"]

[tool.ruff]
target-version = "py312"

[tool.ty.environment]
python-version = "3.12"
